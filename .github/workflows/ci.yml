name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version parity
        run: npm run check:version

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run tests with scheduler.yield()
        run: npm run test:scheduler

      - name: Check type declarations (TypeScript 6)
        run: npm run test:types

      - name: Check type declarations (TypeScript 7)
        if: matrix.node == '22'
        run: npx -y -p typescript@7 tsc -p tests/types

      - name: Build bundles
        run: npm run build

      - name: Check bundle sizes
        run: npm run check:size

  e2e:
    name: Examples in ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run examples in ${{ matrix.browser }}
        run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
